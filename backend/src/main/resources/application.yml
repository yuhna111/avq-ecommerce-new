spring:
  application:
    name: avq-clothing
  # Profile mặc định "local" nạp application-local.yml (không đưa lên git).
  # Có thể thay bằng biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD.
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/avq_db_vp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    # Hibernate CHỈ kiểm tra schema, không tạo/sửa bảng (CLAUDE.md mục 2, 7)
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

server:
  port: 8080

payment:
  provider: mock

ai:
  enabled: false

# Ảnh sản phẩm tải lên (ImageStorage): thư mục lưu, giới hạn kích thước
app:
  upload-dir: uploads
